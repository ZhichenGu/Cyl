<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八推杆 HiveMQ 控制台</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101725;--panel:#1a2435;--line:#33425b;--blue:#64b5ff;--red:#ff7777;--green:#72d4a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:15px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.page{max-width:1420px;margin:auto;padding:28px 18px}h1{margin:0 0 6px}p{color:#b5c2d8}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.connection{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rod{border:1px solid var(--line);border-radius:12px;padding:14px}h2{font-size:17px;margin:0 0 13px}.times{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#b5c2d8}input,select{margin-top:5px;width:100%;border:1px solid #50627f;background:#0d1420;color:#fff;padding:9px;border-radius:7px}button{border:0;border-radius:7px;padding:10px 12px;font-weight:650;cursor:pointer;background:var(--blue);color:#07101d}button:disabled{cursor:not-allowed;filter:grayscale(.65);opacity:.45}button.stop{background:var(--red)}button.save{background:var(--green)}button.clear{padding:6px 10px;background:#50627f;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.hint{font-size:12px}.status{font-weight:650;color:#ffd36b}#log{white-space:pre-wrap;max-height:180px;overflow:auto;background:#0b111c;padding:10px;border-radius:7px;font:12px ui-monospace,monospace}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.connection{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.connection{grid-template-columns:1fr}.page{padding:18px}}
</style></head><body><main class="page">
<h1>八个电动推杆方案控制台</h1><p>网页通过 HiveMQ 控制两块 ESP32；连接或重连后先停止全部推杆，再读取四套方案。</p>
<section class="panel"><h2>HiveMQ 连接</h2><div class="connection"><label>服务器地址<input id="host" placeholder="例如 xxxxx.s1.eu.hivemq.cloud"></label><label>WebSocket 端口<input id="port" type="number" value="8884"></label><label>用户名<input id="user" autocomplete="username"></label><label>密码<input id="pass" type="password" autocomplete="current-password"></label><label>Topic 根目录<input id="root" value="pushrod"></label><button id="connect">连接</button></div><p class="hint">ESP 程序中的服务器、账号、密码和根目录必须相同。状态：<span id="state" class="status">未连接</span></p></section>
<section class="panel"><h2>定时方案</h2><div class="actions"><label>当前编辑方案<select id="profile" onchange="changeProfile()"><option value="1">方案 1</option><option value="2">方案 2</option><option value="3">方案 3</option><option value="4">方案 4</option></select></label><button id="readConfig" onclick="readConfigs()" disabled>停止并重新读取</button><button id="saveProfile" class="save" onclick="saveCurrentProfile()" disabled>保存当前方案</button><button id="startProfile" onclick="startCurrentProfile()" disabled>启动方案</button><button id="startSequence" onclick="startProfileSequence()" disabled>方案 1 → 2 → 3 → 4 循环</button><button class="stop" onclick="stopAllBoards()">全部紧急停止</button></div><p class="hint">单位为毫秒，单段最大 3,600,000。保存后回读核对，通过后才能启动。所有新动作先停止全部推杆并等待 400 毫秒；每个“暂停全部”也会停止八根推杆。两块板独立循环，不保证同步。请只用一个控制页面操作；停止回复没有指令编号，无法排除其他客户端或延迟消息干扰。断网时网页无法保证停机。</p></section>
<p id="deviceStatus" class="hint"></p><section class="grid" id="rods"></section><section class="panel"><div class="panel-title"><h2>通信日志</h2><button class="clear" onclick="clearLog()">清空</button></div><div id="log">等待连接。</div></section></main>
<script>

const MAX=3600000,boards=['esp1234','esp5678'],fields=[['inPause','收回后暂停'],['extend','伸出时长'],['outPause','伸出后暂停'],['retract','收回时长']],$=id=>document.getElementById(id);
let client,root='',generation=0,busy=false,visible=0,loaded=false,waiter;
const ready=new Set(),seen=new Map();
const profiles=Array.from({length:4},()=>Array.from({length:8},()=>Object.fromEntries(fields.map(([k])=>[k,k.includes('Pause')?1000:3000]))));
const token=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]),board=r=>r<=4?boards[0]:boards[1],profileNo=()=>visible+1;
function log(s){$('log').textContent=(new Date().toLocaleTimeString()+'  '+s+'\n'+$('log').textContent).slice(0,18000)}
function clearLog(){$('log').textContent=''}
function render(){$('rods').innerHTML=Array.from({length:8},(_,i)=>'<article class="rod"><h2>推杆 '+(i+1)+'（'+board(i+1)+'）</h2><div class="times">'+fields.map(([k,n])=>'<label>'+n+'<input id="'+k+(i+1)+'" type="number" min="0" max="'+MAX+'" step="100" oninput="dirty()"></label>').join('')+'</div><div class="actions"><button data-motion onclick="testRod('+(i+1)+')">测试循环</button><button data-motion onclick="manual('+(i+1)+',\'extend\')">伸出</button><button data-motion onclick="manual('+(i+1)+',\'retract\')">缩回</button><button class="stop" onclick="stopAllBoards()">暂停全部</button></div></article>').join('');showVisible()}
function showVisible(){for(let r=1;r<=8;r++)for(const[k]of fields)$ (k+r).value=profiles[visible][r-1][k]}
function saveVisible(){for(let r=1;r<=8;r++)for(const[k]of fields)profiles[visible][r-1][k]=Number($(k+r).value)}
function valid(r){return fields.every(([k])=>{const s=$(k+r).value,v=Number(s);return String(s).trim()!==''&&Number.isInteger(v)&&v>=0&&v<=MAX})}
function dirty(){if(busy)return;ready.delete(profileNo());controls()}
function changeProfile(){if(busy){$('profile').value=String(profileNo());return}saveVisible();visible=Number($('profile').value)-1;showVisible();controls()}
function controls(){
const connected=!!client?.connected;
$('saveProfile').disabled=!connected||busy||!loaded;
$('startProfile').disabled=!connected||busy||!ready.has(profileNo());
$('startSequence').disabled=!connected||busy||ready.size!==4;
$('profile').disabled=busy;
document.querySelectorAll('#rods input').forEach(e=>e.disabled=busy);
document.querySelectorAll('[data-motion]').forEach(e=>e.disabled=!connected||busy||!loaded);
$('readConfig').disabled=!connected||busy;
$('deviceStatus').textContent=boards.map(b=>{const t=seen.get(b);return b+'：'+(t?'最近回复 '+Math.floor((Date.now()-t)/1000)+' 秒前'+(Date.now()-t>15000?'，当前状态未知':'（不代表持续在线）'):'状态未知')}).join('；');
}
function cancel(reason){generation++;if(waiter){const w=waiter;waiter=undefined;clearTimeout(w.timer);w.reject(new Error(reason))}busy=false;controls()}
function check(g){if(g!==generation||!client?.connected)throw new Error('操作已取消或连接中断')}
function send(s,m,g){check(g);client.publish(root+'/'+s,m,{qos:0,retain:false},e=>{if(e&&g===generation){log('发送失败：'+e.message);cancel('发送失败')}})}
function expect(g,accept,ms=7000){check(g);return new Promise((resolve,reject)=>{const w={g,accept,resolve,reject};w.timer=setTimeout(()=>{if(waiter===w){waiter=undefined;reject(new Error('等待设备回复超时，已取消后续操作'))}},ms);waiter=w})}
function delay(g,ms){return new Promise(resolve=>setTimeout(resolve,ms)).then(()=>check(g))}
function handle(topic,msg,packet){
const b=topic.split('/').at(-2);if(!boards.includes(b)||topic!==root+'/'+b+'/status')return;
// Firmware retains state strings. A retained subscription snapshot is never a fresh stop acknowledgement.
if(packet?.retain)return;
seen.set(b,Date.now());controls();
if(msg==='offline'){seen.delete(b);cancel('设备离线');return}
const w=waiter;if(w&&w.g===generation){try{const result=w.accept(b,msg);if(result!==undefined){waiter=undefined;clearTimeout(w.timer);w.resolve(result)}}catch(e){waiter=undefined;clearTimeout(w.timer);w.reject(e)}}
}
async function stopped(g){
const got=new Set();const p=expect(g,(b,m)=>{if(m==='stopped')got.add(b);if(got.size===2)return true});
send('all/cmd','stop',g);await p;check(g);
await delay(g,400);log('两块板已回复停止，已等待 400 毫秒');
}
async function dump(g){
for(let attempt=1;attempt<=3;attempt++){
check(g);const t=token(),data=structuredClone(profiles),values=new Set(),ends=new Set();
const p=expect(g,(b,m)=>{
let a=m.split(',');
if(a[0]==='config_data'&&a.length===8&&a[1]===t){
const [p,r,...xs]=a.slice(2).map(Number);
if(Number.isInteger(p)&&p>=1&&p<=4&&Number.isInteger(r)&&r>=1&&r<=8&&board(r)===b&&xs.every(x=>Number.isInteger(x)&&x>=0&&x<=MAX)){
fields.forEach(([k],i)=>data[p-1][r-1][k]=xs[i]);values.add(p+':'+r);
}}
if(a[0]==='config_end'&&a.length===2&&a[1]===t)ends.add(b);
if(values.size===32&&ends.size===2)return data;
},6000);
send('all/cmd','get_config,'+t,g);
try{return await p}catch(e){check(g);if(attempt===3)throw e;log('配置不完整，重试 '+(attempt+1)+'/3')}
}}
async function operation(fn){if(busy||!client?.connected)return;const g=++generation;busy=true;controls();try{await fn(g);check(g)}catch(e){if(g===generation){log(e.message);$('state').textContent='操作未完成；请检查设备回复'}}finally{if(g===generation){busy=false;controls()}}}
function readConfigs(){return operation(async g=>{
ready.clear();await stopped(g);const data=await dump(g);check(g);
data.forEach((p,i)=>p.forEach((r,j)=>Object.assign(profiles[i][j],r)));
loaded=true;for(let p=1;p<=4;p++)ready.add(p);showVisible();
$('state').textContent='配置已读取；设备已回复停止';log('32 组配置读取完整');
})}
function saveCurrentProfile(){if(busy||!loaded)return;if(!Array.from({length:8},(_,i)=>valid(i+1)).every(Boolean))return log('请输入 0–3600000 的整数时间');
saveVisible();const p=profileNo(),snapshot=structuredClone(profiles[p-1]);ready.delete(p);
return operation(async g=>{
await stopped(g);const t=token(),got=new Set();
const ack=expect(g,(b,m)=>{const a=m.split(',');if(a.length===3&&a[1]===String(p)&&a[2]===t){if(a[0]==='profile_save_failed')throw new Error(b+' 写入失败');if(a[0]==='profile_saved')got.add(b)}if(got.size===2)return true},12000);
for(let r=1;r<=8;r++)send(board(r)+'/cmd','config,'+p+','+r+','+fields.map(([k])=>snapshot[r-1][k]).join(','),g);
for(const b of boards)send(b+'/cmd','confirm,'+p+','+t,g);
await ack;check(g);log('收到写入确认，正在回读核对');
const actual=await dump(g);check(g);
if(!snapshot.every((r,i)=>fields.every(([k])=>r[k]===actual[p-1][i][k])))throw new Error('回读与本次保存不一致；禁止启动，请重新保存');
ready.add(p);log('方案 '+p+' 写入确认及 32 项时间回读核对通过');$('state').textContent='保存核对通过；尚未启动';
})}
function motion(s,m){return operation(async g=>{await stopped(g);check(g);send(s,m,g);log('已发送动作指令；此固件不提供带编号的执行确认');$('state').textContent='动作指令已发送；运行中不读取配置'})}
function startCurrentProfile(){if(ready.has(profileNo()))return motion('all/cmd','run,'+profileNo())}
function startProfileSequence(){if(ready.size===4)return motion('all/cmd','run_all')}
function manual(r,a){if(loaded&&['extend','retract'].includes(a))return motion(board(r)+'/cmd','manual,'+r+','+a)}
function testRod(r){if(!loaded||!valid(r))return log('请先读取配置并检查时间');return motion(board(r)+'/cmd','test,'+r+','+fields.map(([k])=>Number($(k+r).value)).join(','))}
function stopAllBoards(){cancel('已被全部停止取消');if(!client?.connected){log('连接已断开，无法送达停止指令');return}return operation(async g=>{await stopped(g);$('state').textContent='两块板已回复停止'})}
function connect(){
const host=$('host').value.trim(),port=Number($('port').value),newRoot=$('root').value.trim().replace(/^\/+|\/+$/g,'');
if(!host||/[\/\s]/.test(host)||!Number.isInteger(port)||port<1||port>65535||!newRoot||/[+#]/.test(newRoot))return log('请检查域名、端口和 Topic 根目录');
cancel('连接已切换');const old=client;client=undefined;old?.end(true);ready.clear();seen.clear();loaded=false;root=newRoot;
const next=mqtt.connect('wss://'+host+':'+port+'/mqtt',{username:$('user').value,password:$('pass').value,clientId:'pushrod-web-'+token(),reconnectPeriod:2000,connectTimeout:8000,queueQoSZero:false,resubscribe:false});
client=next;$('state').textContent='连接中…';controls();
next.on('connect',()=>{if(client!==next)return;cancel('重新连接');ready.clear();seen.clear();loaded=false;const g=generation;$('state').textContent='已连接，先停止设备';
next.subscribe(root+'/+/status',{qos:0},(e,granted)=>{if(client!==next||g!==generation)return;if(e||granted?.some(x=>x.qos===128)){log('订阅失败，未发送后续指令');return}readConfigs()})});
next.on('message',(t,p,packet)=>{if(client===next)handle(t,p.toString(),packet)});
next.on('close',()=>{if(client!==next)return;cancel('连接中断');ready.clear();seen.clear();loaded=false;$('state').textContent='连接中断，无法保证设备停止；重连后将先停止';controls()});
next.on('error',e=>{if(client===next)log('连接错误：'+e.message)});
}
$('connect').onclick=connect;render();controls();setInterval(controls,1000);

</script></body></html>
