<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八推杆 HiveMQ 控制台</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101725;--panel:#1a2435;--line:#33425b;--blue:#64b5ff;--red:#ff7777;--green:#72d4a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:15px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.page{max-width:1420px;margin:auto;padding:28px 18px}h1{margin:0 0 6px}p{color:#b5c2d8}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.connection{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rod{border:1px solid var(--line);border-radius:12px;padding:14px}h2{font-size:17px;margin:0 0 13px}.times{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#b5c2d8}input,select{margin-top:5px;width:100%;border:1px solid #50627f;background:#0d1420;color:#fff;padding:9px;border-radius:7px}button{border:0;border-radius:7px;padding:10px 12px;font-weight:650;cursor:pointer;background:var(--blue);color:#07101d}button:disabled{cursor:not-allowed;filter:grayscale(.65);opacity:.45}button.stop{background:var(--red)}button.save{background:var(--green)}button.clear{padding:6px 10px;background:#50627f;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.hint{font-size:12px}.status{font-weight:650;color:#ffd36b}#log{white-space:pre-wrap;max-height:180px;overflow:auto;background:#0b111c;padding:10px;border-radius:7px;font:12px ui-monospace,monospace}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.connection{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.connection{grid-template-columns:1fr}.page{padding:18px}}
</style></head><body><main class="page">
<h1>八个电动推杆方案控制台</h1><p>网页通过 HiveMQ 控制两块 ESP32；连接后会自动读取设备中保存的四套方案。</p>
<section class="panel"><h2>HiveMQ 连接</h2><div class="connection"><label>服务器地址<input id="host" placeholder="例如 xxxxx.s1.eu.hivemq.cloud"></label><label>WebSocket 端口<input id="port" type="number" value="8884"></label><label>用户名<input id="user" autocomplete="username"></label><label>密码<input id="pass" type="password" autocomplete="current-password"></label><label>Topic 根目录<input id="root" value="pushrod"></label><button id="connect">连接</button></div><p class="hint">ESP 程序中的服务器、账号、密码和根目录必须相同。状态：<span id="state" class="status">未连接</span></p></section>
<section class="panel"><h2>定时方案</h2><div class="actions"><label>当前编辑方案<select id="profile" onchange="changeProfile()"><option value="1">方案 1</option><option value="2">方案 2</option><option value="3">方案 3</option><option value="4">方案 4</option></select></label><button id="saveProfile" class="save" onclick="saveCurrentProfile()" disabled>保存当前方案</button><button id="startProfile" onclick="startCurrentProfile()" disabled>启动方案</button><button id="startSequence" onclick="startProfileSequence()" disabled>方案 1 → 2 → 3 → 4 循环</button><button class="stop" onclick="stopAllBoards()">全部紧急停止</button></div><p class="hint">单位为毫秒，单段最大 3,600,000。“保存”只写入板载存储；两块板都确认保存后才允许启动。循环模式会等待八根推杆都完成一轮，再同步切换下一方案。</p></section>
<section class="grid" id="rods"></section><section class="panel"><div class="panel-title"><h2>通信日志</h2><button class="clear" onclick="clearLog()">清空</button></div><div id="log">等待连接。</div></section></main>
<script>
const MAX=3600000,RODS=8,PROFILES=4,boards=['esp1234','esp5678'],fields=[['inPause','收回后暂停'],['extend','伸出时长'],['outPause','伸出后暂停'],['retract','收回时长']],$=id=>document.getElementById(id);
const profiles=Array.from({length:PROFILES},()=>Array.from({length:RODS},()=>Object.fromEntries(fields.map(([k])=>[k,k.includes('Pause')?1000:3000])))),ready=new Set(),online=new Set(),pendingActions=new Map();let client,pendingSave,pendingLoad,sequence,visible=0,loaded=false;
const token=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]),profile=()=>Number($('profile').value)-1,profileNo=()=>profile()+1,board=rod=>rod<=4?'esp1234':'esp5678';
function log(s){$('log').textContent=`${new Date().toLocaleTimeString()}  ${s}\n`+$('log').textContent}function clearLog(){$('log').textContent=''}
function render(){$('rods').innerHTML=Array.from({length:RODS},(_,i)=>`<article class="rod"><h2>推杆 ${i+1}（${i<4?'ESP32 #1':'ESP32 #2'}）</h2><div class="times">${fields.map(([k,n])=>`<label>${n}<input id="${k}${i+1}" type="number" min="0" max="${MAX}" step="100" value="${profiles[0][i][k]}" oninput="dirty()"></label>`).join('')}</div><div class="actions"><button onclick="testRod(${i+1})">测试循环</button><button onclick="manual(${i+1},'extend')">伸出</button><button onclick="manual(${i+1},'retract')">缩回</button><button class="stop" onclick="manual(${i+1},'stop')">暂停</button></div></article>`).join('')}
function value(k,r){return Number($(`${k}${r}`).value)}function valid(r){for(const[k]of fields){const v=value(k,r);if(!Number.isInteger(v)||v<0||v>MAX){log(`推杆 ${r} 的时间必须是 0–${MAX} 之间的整数。`);return false}}return true}function validProfile(){for(let r=1;r<=RODS;r++)if(!valid(r))return false;return true}
function saveVisible(){for(let r=1;r<=RODS;r++)for(const[k]of fields){const v=value(k,r);if(Number.isFinite(v))profiles[visible][r-1][k]=v}}function showVisible(){for(let r=1;r<=RODS;r++)for(const[k]of fields)$(`${k}${r}`).value=profiles[visible][r-1][k]}function dirty(){ready.delete(profileNo());controls()}function changeProfile(){saveVisible();visible=profile();showVisible();controls()}
function cfg(){return{host:$('host').value.trim(),port:Number($('port').value),username:$('user').value,password:$('pass').value,root:$('root').value.trim().replace(/^\/+|\/+$/g,'')}}function publish(s,m){const c=cfg();if(!client?.connected){log('尚未连接 HiveMQ。');return false}client.publish(`${c.root}/${s}`,m,{qos:1},e=>log(e?`发送失败：${e.message}`:`发送：${s} ← ${m}`));return true}
function controls(){const ok=!!client?.connected&&boards.every(b=>online.has(b)),busy=!!pendingSave||!!pendingLoad;$('saveProfile').disabled=!ok||busy;$('startProfile').disabled=!ok||busy||!ready.has(profileNo());$('startSequence').disabled=!ok||busy||ready.size!==PROFILES}
function reset(){if(pendingSave)clearTimeout(pendingSave.timer);if(pendingLoad)clearTimeout(pendingLoad.timer);pendingSave=pendingLoad=sequence=undefined;for(const x of pendingActions.values())clearTimeout(x.timer);pendingActions.clear()}
function connect(){if(client)client.end(true);reset();const c=cfg();if(!c.host||!c.root)return log('请填写服务器地址和 Topic 根目录。');online.clear();ready.clear();loaded=false;controls();$('state').textContent='连接中…';const next=mqtt.connect(`wss://${c.host}:${c.port}/mqtt`,{username:c.username,password:c.password,clientId:'pushrod-web-'+token(),reconnectPeriod:2000,connectTimeout:8000});client=next;next.on('connect',()=>{if(client!==next)return;$('state').textContent='已连接，读取配置中…';log('HiveMQ 已连接');next.subscribe(`${cfg().root}/+/status`,{qos:1},e=>e?log('订阅状态失败：'+e.message):requestConfigs())});next.on('reconnect',()=>{$('state').textContent='重连中…'});next.on('error',e=>log('错误：'+e.message));next.on('close',()=>{$('state').textContent='已断开';online.clear();sequence=undefined;controls()});next.on('message',(t,p)=>handle(t,p.toString()))}
function track(action,t,expect,done){const x={action,expect:new Set(expect),got:new Set(),done};x.timer=setTimeout(()=>{log(`${action} 执行确认超时：${[...x.expect].filter(b=>!x.got.has(b)).join('、')}`);pendingActions.delete(t)},6000);pendingActions.set(t,x)}function ack(b,a,t){const x=pendingActions.get(t);if(!x||x.action!==a||!x.expect.has(b))return;x.got.add(b);if(x.got.size===x.expect.size){clearTimeout(x.timer);pendingActions.delete(t);log(`${a} 已由目标设备全部确认。`);x.done?.()}}
function requestConfigs(tryNo=1){if(pendingLoad)clearTimeout(pendingLoad.timer);const t=token();pendingLoad={t,values:new Set(),boards:new Set()};pendingLoad.timer=setTimeout(()=>{if(pendingLoad?.t!==t)return;if(tryNo<3){log(`读取配置不完整，正在重试（${tryNo+1}/3）。`);requestConfigs(tryNo+1)}else{pendingLoad=undefined;$('state').textContent='配置读取失败';log(`读取配置失败：未收到完整的 ${PROFILES*RODS} 组数据。`);controls()}},5000);track('get_config',t,boards);publish('all/cmd',`get_config,${t}`);controls()}
function finishLoad(){if(!pendingLoad||pendingLoad.values.size!==PROFILES*RODS||pendingLoad.boards.size!==boards.length)return;clearTimeout(pendingLoad.timer);pendingLoad=undefined;loaded=true;for(let p=1;p<=PROFILES;p++)ready.add(p);showVisible();$('state').textContent='已连接，两块 ESP32 在线';log('已读取两块 ESP32 中保存的四套方案。');controls()}
function handle(topic,msg){const b=topic.split('/').at(-2);if(!boards.includes(b))return;if(msg==='offline'){online.delete(b);controls();return}online.add(b);let m=msg.match(/^config_value,(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+)$/);if(m&&pendingLoad&&m[7]===pendingLoad.t){const[p,r,...xs]=m.slice(1,7).map(Number);if(p>=1&&p<=PROFILES&&r>=1&&r<=RODS&&xs.every(x=>Number.isInteger(x)&&x>=0&&x<=MAX)){fields.forEach(([k],i)=>profiles[p-1][r-1][k]=xs[i]);pendingLoad.values.add(`${p}:${r}`)}finishLoad();return}m=msg.match(/^config_dump_done,(\d+)$/);if(m&&pendingLoad&&m[1]===pendingLoad.t){pendingLoad.boards.add(b);finishLoad();return}m=msg.match(/^(profile_saved|profile_save_failed|profile_save_incomplete),(\d+),(\d+)$/);if(m&&pendingSave&&Number(m[2])===pendingSave.p&&m[3]===pendingSave.t){(m[1]==='profile_saved'?pendingSave.ok:pendingSave.bad).add(b);if(pendingSave.ok.size+pendingSave.bad.size===boards.length){clearTimeout(pendingSave.timer);const s=pendingSave,p=s.p;pendingSave=undefined;if(s.bad.size){ready.delete(p);log(`方案 ${p} 保存失败。`)}else{ready.add(p);log(`方案 ${p} 已由两块 ESP32 完整保存，可以启动。`)}controls()}return}m=msg.match(/^ack,([^,]+),(\d+)$/);if(m){ack(b,m[1],m[2]);return}m=msg.match(/^sequence_done,(\d+),(\d+)$/);if(m&&sequence&&Number(m[1])===sequence.p&&m[2]===sequence.t){sequence.done.add(b);if(sequence.done.size===boards.length)dispatchSequence(sequence.p%PROFILES+1);return}if(loaded&&boards.every(x=>online.has(x)))$('state').textContent='已连接，两块 ESP32 在线';log(`${topic}: ${msg}`);controls()}
function saveCurrentProfile(){if(!validProfile()||pendingSave)return;saveVisible();const p=profileNo(),t=token();ready.delete(p);pendingSave={p,t,ok:new Set(),bad:new Set()};for(let r=1;r<=RODS;r++){const x=profiles[p-1][r-1];publish(`${board(r)}/cmd`,`config,${p},${r},${x.inPause},${x.extend},${x.outPause},${x.retract},${t}`)}for(const b of boards)publish(`${b}/cmd`,`confirm,${p},${t}`);pendingSave.timer=setTimeout(()=>{if(pendingSave?.t===t){pendingSave=undefined;ready.delete(p);log(`方案 ${p} 保存确认超时。`);controls()}},10000);log(`已发送方案 ${p}，等待两块 ESP32 检查完整性并保存。`);controls()}
function startCurrentProfile(){const p=profileNo();if(!ready.has(p))return log('当前方案尚未由两块 ESP32 确认保存。');sequence=undefined;const t=token();track('run',t,boards);publish('all/cmd',`run,${p},${t}`)}function stopAllBoards(){sequence=undefined;const t=token();track('stop',t,boards);publish('all/cmd',`stop,${t}`)}function manual(r,a){sequence=undefined;const t=token();track('manual',t,[board(r)]);publish(`${board(r)}/cmd`,`manual,${r},${a},${t}`)}function testRod(r){if(!valid(r))return;sequence=undefined;const st=token();track('stop',st,boards,()=>{const t=token();track('test',t,[board(r)]);publish(`${board(r)}/cmd`,`test,${r},${value('inPause',r)},${value('extend',r)},${value('outPause',r)},${value('retract',r)},${t}`)});publish('all/cmd',`stop,${st}`)}function startProfileSequence(){if(ready.size!==PROFILES)return log('四套方案必须全部从设备读取或确认保存后才能启动循环。');sequence={t:token(),p:1,done:new Set()};dispatchSequence(1)}function dispatchSequence(p){if(!sequence)return;sequence.p=p;sequence.done.clear();track('sequence',sequence.t,boards);publish('all/cmd',`sequence,${p},${sequence.t}`);log(`同步循环：启动方案 ${p}。`)}
$('connect').onclick=connect;render();controls();
</script></body></html>
