<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八推杆 HiveMQ 控制台</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101725;--panel:#1a2435;--line:#33425b;--blue:#64b5ff;--red:#ff7777;--green:#72d4a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:15px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.page{max-width:1420px;margin:auto;padding:28px 18px}h1{margin:0 0 6px}p{color:#b5c2d8}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.connection{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rod{border:1px solid var(--line);border-radius:12px;padding:14px}h2{font-size:17px;margin:0 0 13px}.times{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#b5c2d8}input,select{margin-top:5px;width:100%;border:1px solid #50627f;background:#0d1420;color:#fff;padding:9px;border-radius:7px}button{border:0;border-radius:7px;padding:10px 12px;font-weight:650;cursor:pointer;background:var(--blue);color:#07101d}button.stop{background:var(--red)}button.save{background:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.hint{font-size:12px}.status{font-weight:650;color:#ffd36b}#log{white-space:pre-wrap;max-height:150px;overflow:auto;background:#0b111c;padding:10px;border-radius:7px;font:12px ui-monospace,monospace}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.connection{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.connection{grid-template-columns:1fr}.page{padding:18px}}
</style></head><body><main class="page">
<h1>八个电动推杆方案控制台</h1><p>网页通过 HiveMQ 控制两块 ESP32；每块 ESP32 管理 4 个推杆，并保存 4 套定时方案。</p>
<section class="panel"><h2>HiveMQ 连接</h2><div class="connection">
<label>服务器地址<input id="host" placeholder="例如 xxxxx.s1.eu.hivemq.cloud"></label><label>WebSocket 端口<input id="port" type="number" value="8884"></label><label>用户名<input id="user" autocomplete="username"></label><label>密码<input id="pass" type="password" autocomplete="current-password"></label><label>Topic 根目录<input id="root" value="pushrod"></label><button id="connect">连接</button>
</div><p class="hint">HiveMQ Cloud 通常为 <code>wss://服务器:8884/mqtt</code>。此处的账号、服务器和 Topic 根目录须与两个 ESP32 程序一致。<span id="state" class="status">未连接</span></p></section>
<section class="panel"><h2>定时方案</h2><div class="actions"><label>当前编辑方案<select id="profile" onchange="changeProfile()"><option value="1">方案 1</option><option value="2">方案 2</option><option value="3">方案 3</option><option value="4">方案 4</option></select></label><button class="save" onclick="saveAndRun()">保存并启动当前方案</button><button onclick="publish('all/cmd','run_all')">方案 1 → 2 → 3 → 4 循环</button><button class="stop" onclick="publish('all/cmd','stop')">全部紧急停止</button></div><p class="hint">时间单位为毫秒。保存时，网页会等待两块板均确认写入成功后才启动。单杆测试和手动控制会停止其他推杆。</p></section>
<section class="grid" id="rods"></section><section class="panel"><h2>通信日志</h2><div id="log">等待连接。</div></section></main>
<script>
let client,pendingSave,visibleProfile=0;const $=id=>document.getElementById(id);const fields=[['inPause','收回后暂停'],['extend','伸出时长'],['outPause','伸出后暂停'],['retract','收回时长']];const boards=['esp1234','esp5678'];
const defaultValue=k=>k==='inPause'||k==='outPause'?1000:3000;const profiles=Array.from({length:4},()=>Array.from({length:8},()=>Object.fromEntries(fields.map(([k])=>[k,defaultValue(k)]))));
const currentProfile=()=>Number($('profile').value)-1;const boardFor=rod=>rod<=4?'esp1234':'esp5678';
function render(){$('rods').innerHTML=Array.from({length:8},(_,i)=>`<article class="rod"><h2>推杆 ${i+1}（${boardFor(i+1)}）</h2><div class="times">${fields.map(([k,n])=>`<label>${n}<input id="${k}${i+1}" type="number" min="0" step="100" value="${profiles[0][i][k]}"></label>`).join('')}</div><div class="actions"><button onclick="testRod(${i+1})">测试循环</button><button onclick="manual(${i+1},'extend')">伸出</button><button onclick="manual(${i+1},'retract')">缩回</button><button class="stop" onclick="manual(${i+1},'stop')">暂停</button></div></article>`).join('')}
function v(k,n){return Math.max(0,Number($(`${k}${n}`).value)||0)}function storeVisibleProfile(){for(let n=1;n<=8;n++)fields.forEach(([k])=>profiles[visibleProfile][n-1][k]=v(k,n))}function changeProfile(){storeVisibleProfile();visibleProfile=currentProfile();for(let n=1;n<=8;n++)fields.forEach(([k])=>$(`${k}${n}`).value=profiles[visibleProfile][n-1][k])}
function log(s){$('log').textContent=`${new Date().toLocaleTimeString()}  ${s}\n`+$('log').textContent}function config(){return{host:$('host').value.trim(),port:Number($('port').value),username:$('user').value,password:$('pass').value,root:$('root').value.trim().replace(/^\/+|\/+$/g,'')}}
function connect(){if(client)client.end(true);const c=config();if(!c.host||!c.root)return log('请填写服务器地址和 Topic 根目录。');$('state').textContent='连接中…';client=mqtt.connect(`wss://${c.host}:${c.port}/mqtt`,{username:c.username,password:c.password,clientId:'pushrod-web-'+crypto.randomUUID(),reconnectPeriod:2000,connectTimeout:8000});client.on('connect',()=>{$('state').textContent='已连接';log('HiveMQ 已连接');client.subscribe(`${c.root}/+/status`)});client.on('reconnect',()=>{$('state').textContent='重连中…'});client.on('error',e=>log('错误：'+e.message));client.on('close',()=>{$('state').textContent='已断开'});client.on('message',(topic,payload)=>handleMessage(topic,payload.toString()))}
function publish(suffix,message){const c=config();if(!client||!client.connected)return log('尚未连接 HiveMQ。');client.publish(`${c.root}/${suffix}`,message,{qos:1},e=>log(e?`发送失败：${e.message}`:`发送：${suffix} ← ${message}`))}function manual(rod,action){publish(boardFor(rod)+'/cmd',`manual,${rod},${action}`)}function testRod(rod){storeVisibleProfile();publish('all/cmd','stop');publish(boardFor(rod)+'/cmd',`test,${rod},${v('inPause',rod)},${v('extend',rod)},${v('outPause',rod)},${v('retract',rod)}`);log(`已停止其他推杆，开始测试推杆 ${rod}。`)}
function handleMessage(topic,message){log(`${topic}: ${message}`);if(!pendingSave)return;const board=topic.split('/').at(-2),m=message.match(/^(profile_saved|profile_save_failed),(\d+),(\d+)$/);if(!m||Number(m[2])!==pendingSave.profile||m[3]!==pendingSave.token||!boards.includes(board))return;if(m[1]==='profile_save_failed'){clearTimeout(pendingSave.timer);pendingSave=undefined;return log(`未启动：${board} 写入失败。`)}pendingSave.boards.add(board);if(pendingSave.boards.size===2){const profile=pendingSave.profile;clearTimeout(pendingSave.timer);pendingSave=undefined;log(`两块板均已确认，启动方案 ${profile}。`);publish('all/cmd',`run,${profile}`)}}
function saveAndRun(){if(!client||!client.connected)return log('尚未连接 HiveMQ。');storeVisibleProfile();const profile=currentProfile()+1,token=String(Date.now()%1000000000);if(pendingSave)clearTimeout(pendingSave.timer);pendingSave={profile,token,boards:new Set};publish('all/cmd','stop');for(let rod=1;rod<=8;rod++)publish(boardFor(rod)+'/cmd',`config,${profile},${rod},${v('inPause',rod)},${v('extend',rod)},${v('outPause',rod)},${v('retract',rod)}`);boards.forEach(board=>publish(board+'/cmd',`confirm,${profile},${token}`));pendingSave.timer=setTimeout(()=>{if(!pendingSave||pendingSave.token!==token)return;const missing=boards.filter(b=>!pendingSave.boards.has(b));log(`未启动：等待 ${missing.join('、')} 确认超时。`);pendingSave=undefined},10000);log(`已发送方案 ${profile}，等待两块 ESP32 保存确认。`)}
$('connect').onclick=connect;render();
</script></body></html>
